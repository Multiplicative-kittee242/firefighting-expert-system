# Door button render shape (orientation/align/valign), keyed by code. Position lives in
# controls.yaml's door-buttons-placing — merged back together by gui.input.DoorSealingButtonGroup.
# Size is not authored per item: every door is either "standard" or "fireRated" (see
# config.loading.DeckMapTopologyConfig#getFireRatedByDoorCode, derived from topology.yaml's doors —
# not duplicated here), and gui.input.DoorSealingButtonGroup picks the matching size below, swapping
# width/height for HORISONTAL doors (both sizes here are given in VERTICAL form).
# orientation/align/valign parse into config.enums.DoorOrientation/DoorSide/DoorDirection; a
# fire-rated door's glyph does not use align (vertical) or align+valign (horisontal) at all, so
# those keys are simply omitted for it rather than given a placeholder value.
door-button-group:
  size:
    standard:  {width: 18, height: 30}
    fireRated: {width: 22, height: 34}
  items:
    - {code: "AQ", orientation: "VERTICAL",   valign: "BOTTOM", align: "RIGHT"}
    - {code: "EF", orientation: "VERTICAL",   valign: "TOP",    align: "RIGHT"}
    - {code: "LM", orientation: "VERTICAL",   valign: "TOP",    align: "LEFT"}
    - {code: "GH", orientation: "VERTICAL",   valign: "BOTTOM", align: "LEFT"}
    - {code: "DE", orientation: "HORISONTAL", valign: "BOTTOM", align: "LEFT"}
    - {code: "DJ", orientation: "HORISONTAL", valign: "TOP",    align: "LEFT"}
    - {code: "DR", orientation: "VERTICAL",   valign: "TOP"}
    - {code: "DQ", orientation: "HORISONTAL", valign: "BOTTOM", align: "LEFT"}
    - {code: "DF", orientation: "HORISONTAL", valign: "BOTTOM", align: "LEFT"}
    - {code: "CP", orientation: "HORISONTAL", valign: "BOTTOM", align: "LEFT"}
    - {code: "MO", orientation: "VERTICAL",   valign: "TOP",    align: "RIGHT"}
    - {code: "HK", orientation: "HORISONTAL", valign: "TOP",    align: "LEFT"}
    - {code: "HI", orientation: "VERTICAL",   valign: "BOTTOM", align: "LEFT"}
    - {code: "HN", orientation: "VERTICAL",   valign: "BOTTOM", align: "RIGHT"}
    - {code: "HM", orientation: "VERTICAL",   valign: "BOTTOM", align: "RIGHT"}
    - {code: "AB", orientation: "VERTICAL",   valign: "BOTTOM"}
    - {code: "DT", orientation: "VERTICAL",   valign: "BOTTOM"}
    - {code: "PT", orientation: "VERTICAL",   valign: "BOTTOM"}
    - {code: "DH", orientation: "HORISONTAL"}

