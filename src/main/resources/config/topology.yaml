  { code: "F1", type: "temperature" },  { code: "F2", type: "temperature" },  { code: "J1", type: "temperature" },
  { code: "J2", type: "temperature" },  { code: "J3", type: "temperature" },  { code: "J4", type: "temperature" },
  { code: "J5", type: "temperature" },  { code: "J6", type: "temperature" },  { code: "J7", type: "rate_of_rise" },
  { code: "J8", type: "temperature" },  { code: "L",  type: "temperature" },  { code: "M",  type: "combined" }
]

hydrant-outlets: [
  { title: "hydr_d1", outlets: 2 },
  { title: "hydr_d2", outlets: 2 },
  { title: "hydr_f",  outlets: 1 },
  { title: "hydr_j",  outlets: 3 },
  { title: "hydr_m",  outlets: 2 },
  { title: "hydr_p",  outlets: 2 },
  { title: "hydr_q",  outlets: 1 }
