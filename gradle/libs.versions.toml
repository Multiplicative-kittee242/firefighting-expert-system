[versions]
victools = "5.0.0"
junit = "6.1.2"
archunit = "1.3.0"
networknt = "3.0.6"
mockito = "5.23.0"
hamcrest = "3.0"

# Jackson (tools.jackson.*) is not pinned here: it is resolved transitively from networknt
# (which declares it as a real compile-scope dependency at 3.1.4) — "Spring-style", the primary
# library dictates the Jackson version. Hamcrest is NOT actually transitive despite matching
# networknt's own test-only version: networknt's POM declares hamcrest with <scope>test</scope>,
# which Maven/Gradle never propagates to consumers. It only ever resolved here because the
# committed gradle.lockfile happened to already pin 3.0 from before this migration; regenerating
# the lockfile from scratch (`--write-locks`) fails with "Could not find org.hamcrest:hamcrest:."
# without an explicit version. Pinned explicitly again, matching networknt's own 3.0.

[libraries]
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }
jsonschema-generator = { module = "com.github.victools:jsonschema-generator", version.ref = "victools" }
jsonschema-module-jackson = { module = "com.github.victools:jsonschema-module-jackson", version.ref = "victools" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "networknt" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
