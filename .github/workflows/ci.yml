name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # test + testIntegration + jacocoTestReport + verifyConfigSchemas + check, no CLIPSJNI native
      # engine involved (see testClips job below) — safe and cheaper on ubuntu-latest. This is the
      # merge gate; the sonar job re-derives its own unit+integration coverage, so nothing coverage-
      # related needs to cross from here.
      - name: Build (compile, test, testIntegration, coverage, schema check)
        run: ./gradlew build -PbuildNumber=${{ github.run_number }}

  testClips:
    name: CLIPS engine tests (32-bit)
    runs-on: windows-latest
    # Documented native flakiness in CLIPSJNI teardown — not a hard merge gate, but the coverage XML
    # is still uploaded when present so Sonar can include engine coverage.
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Keyed on the whole build.gradle so a portableJreVersion/jreFileVersion bump there
      # (see the "Portable 32-bit JRE" section) automatically invalidates this cache too.
      - name: Cache portable 32-bit JRE
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: jre-17-32
          key: ${{ runner.os }}-jre17-32-${{ hashFiles('build.gradle') }}

      # Not part of check/build (same policy as local dev — see AGENTS.md). continue-on-error
      # keeps the job from failing the workflow when the native engine flakes. jacocoTestClipsReport
      # runs testClips and then builds its coverage XML against the classes compiled HERE, so the
      # report's class-ids always match this .exec — the XML is final and needs no cross-machine
      # class matching in the sonar job.
      - name: Run testClips and build its coverage report
        run: ./gradlew jacocoTestClipsReport

      # Upload the XML (not the raw .exec): it is already resolved against matching classes, so the
      # sonar job just drops it in place. Absent if testClips crashed before the report — the sonar
      # job treats that as optional.
      - name: Upload testClips coverage XML
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: jacoco-testclips-xml
          path: build/reports/jacoco/jacocoTestClipsReport/jacocoTestClipsReport.xml
          if-no-files-found: warn

  sonar:
    name: SonarCloud analysis
    # Soft on testClips: still analyze when the engine job flaked, as long as build succeeded. This
    # job regenerates unit+integration coverage itself; the testClips coverage XML is optional.
    needs: [build, testClips]
    if: |
      always()
      && needs.build.result == 'success'
      && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      # Optional: absent when testClips crashed before producing its report. Downloaded into a
      # staging dir, then placed at jacocoTestClipsReport's default output path (the second entry in
      # sonar.coverage.jacoco.xmlReportPaths).
      - name: Download testClips coverage XML
        continue-on-error: true
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: jacoco-testclips-xml
          path: _jacoco_clips

      - name: Stage testClips coverage XML
        shell: bash
        run: |
          xml=$(find _jacoco_clips -name 'jacocoTestClipsReport.xml' 2>/dev/null | head -1)
          if [ -n "$xml" ]; then
            mkdir -p build/reports/jacoco/jacocoTestClipsReport
            cp -f "$xml" build/reports/jacoco/jacocoTestClipsReport/jacocoTestClipsReport.xml
            echo "Placed testClips coverage XML."
          else
            echo "No testClips coverage XML (engine job flaked?) — analyzing with unit+integration only."
          fi

      # sonar dependsOn jacocoTestReport, so this regenerates the unit+integration XML on THIS runner
      # (matching classes compiled here) and unions it with the pre-placed testClips XML per
      # sonar.coverage.jacoco.xmlReportPaths. testClips itself never runs on ubuntu (Windows 32-bit
      # CLIPSJNI) and is not in the sonar task graph.
      #
      # --rerun-tasks: gradle/actions/setup-gradle's Enhanced Caching can otherwise treat sonar as
      # up-to-date and skip the network upload for the same commit.
      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --rerun-tasks -PbuildNumber=${{ github.run_number }}
