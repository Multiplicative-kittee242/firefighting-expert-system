# Modern Gradle settings (2025+), no impact on the 2008 Java code style

# Use configuration cache when possible (speeds up builds)
org.gradle.configuration-cache=true

# Parallel execution
org.gradle.parallel=true

# Caching
org.gradle.caching=true

# Optional: force a specific Java for Gradle daemon if needed
# org.gradle.java.home=C:\\Program Files\\Zulu\\zulu-17

# Increase timeout for slow networks when downloading distributions
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
