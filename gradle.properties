# Use configuration cache when possible (speeds up builds)
org.gradle.configuration-cache=true

# Parallel execution
org.gradle.parallel=true

# Caching
org.gradle.caching=true

# Optional: force a specific Java for Gradle daemon if needed
# org.gradle.java.home=C:\\Program Files\\Zulu\\zulu-17

# Increase timeout for slow networks when downloading distributions
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000

# Show all warnings during build (helps catch deprecated API usage)
org.gradle.warning.mode=all

# Enable build scan (useful for debugging complex builds)
# org.gradle.dependency.verification=off

# ------------------------------------------------------------------
# SonarCloud analysis (org.sonarqube plugin, applied in build.gradle)
# ------------------------------------------------------------------
# Gradle's systemProp.* prefix turns each of these into a real JVM system property, which the
# SonarScanner reads the same way it reads `sonar { properties {} }` in build.gradle (a system
# property wins if both set the same key) — kept here instead of the build script because these are
# static values with no Groovy logic behind them. sonar.organization is inferred from the GitHub org
# (github.com/aleksey-lukyanets) and was confirmed against the real SonarCloud project settings.
systemProp.sonar.projectKey=aleksey-lukyanets_firefighting-expert-system
systemProp.sonar.organization=aleksey-lukyanets
systemProp.sonar.host.url=https://sonarcloud.io

# Two JaCoCo XMLs, unioned by Sonar per line: jacocoTestReport (test + testIntegration) and
# jacocoTestClipsReport (real CLIPS engine — otherwise clips.ExpertSystemService / ClipsEngineAccess
# read ~0% since their tests live only in testClips). Kept as two separate reports, never a
# cross-machine .exec merge — see the coverage section in build.gradle for why. A path that doesn't
# exist (e.g. testClips did not run) is a warning, not an error. Paths are each task's Gradle default.
systemProp.sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml,build/reports/jacoco/jacocoTestClipsReport/jacocoTestClipsReport.xml

# Project-wide rule exclusions — each is a deliberate call for this codebase, not an unreviewed
# blanket suppression. See CODESTYLE.md / AGENTS.md for the reasoning already written down elsewhere;
# kept brief here, one line per criterion.
systemProp.sonar.issue.ignore.multicriteria=e1,e2,e3

# java:S106 "Standard outputs should not be used directly to log anything" — this is a desktop Swing
# app with no logging framework by design (no SLF4J/java.util.logging dependency added — see
# gui.Localization/app.Main call sites and CLI tools ConfigSchemaGenerator/ConfigSchemaVerifier): the
# console *is* the log here. Whole project, not per-file — the same reasoning applies everywhere
# System.out/err appears.
systemProp.sonar.issue.ignore.multicriteria.e1.ruleKey=java:S106
systemProp.sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.java

# java:S5803 "Class members annotated with @VisibleForTesting should not be accessed from production
# code" — util.VisibleForTesting is our own marker (see its own javadoc), and every flagged call is a
# *ButtonGroup calling its own inherited AbstractControlGroup.forEachControl — ordinary
# same-class-hierarchy access, not a leak to unrelated production code.
# ArchitectureRulesTest.visibleForTestingMembersAreOnlyUsedFromTestCode already enforces the real
# invariant (no *other* class may call it) against bytecode. Scoped to the one package this occurs
# in (gui.map.input — formerly gui.input before the map subpackage split), not project-wide — a
# genuine cross-class misuse elsewhere should still be caught. Ant-style **/… so the pattern still
# matches if Sonar's path is base-dir-relative or module-relative.
systemProp.sonar.issue.ignore.multicriteria.e2.ruleKey=java:S5803
systemProp.sonar.issue.ignore.multicriteria.e2.resourceKey=**/gui/map/input/**

# java:S5778 "Only one method invocation is expected when testing runtime exceptions" — a documented,
# acknowledged-by-SonarSource false-positive source for our test style: every flagged assertThrows(...)
# lambda has exactly one *meaningful* call (the method under test) plus harmless, always-succeeding
# argument-building calls (List.of(...), a DAMP test fixture helper, a chained safe getter before the
# real mutator under test — see src/test/java/AGENTS.md). Rewriting ~30 call sites to satisfy this
# literally would reduce DAMP readability for no real safety gain. Test sources only.
systemProp.sonar.issue.ignore.multicriteria.e3.ruleKey=java:S5778
systemProp.sonar.issue.ignore.multicriteria.e3.resourceKey=src/test/**/*.java
